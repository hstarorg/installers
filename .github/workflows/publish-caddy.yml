name: Publish Caddy to GHCR
run-name: Publish caddy-cloudflare ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号，例如 1.0.0 或 1.0.0-rc.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare image tag
        id: image
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::版本号必须是有效的 Docker 标签，例如 1.0.0 或 1.0.0-rc.1"
            exit 1
          fi
          echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/caddy-cloudflare:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both architectures
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:docker-images/caddy"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
