services:
  caddy:
    image: ghcr.io/hstarorg/caddy-cloudflare:${CADDY_IMAGE_TAG:-1.0.0}
    container_name: caddy
    restart: unless-stopped
    environment:
      CF_API_TOKEN: "${CF_API_TOKEN:?请先导出 CF_API_TOKEN}"
    ports:
      - "443:443"
    volumes:
      - "${HOME}/caddy/conf:/etc/caddy:ro"
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
